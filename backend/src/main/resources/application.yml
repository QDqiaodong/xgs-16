server:
  port: 8110
  servlet:
    context-path: /api

spring:
  application:
    name: workspace-manage
  datasource:
    url: jdbc:mysql://localhost:3326/workspace_manage?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: localhost
      port: 6399
      password: redis123456
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB

app:
  upload:
    path: ./uploads
    url-prefix: /uploads
